name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build
        run: make CFLAGS="-O2 -g -Werror"
      - name: Test
        run: make test

  # Boots the real guest image under QEMU and runs the demo from inside the
  # guest: tcp transport via slirp, plus the actual Phase 1 vsock transport
  # (GitHub runners provide KVM and can load vhost_vsock). The ~600 MB base
  # image is downloaded each run and verified against the pinned SHA256;
  # no cache action is used so all dependencies stay SHA-pinned.
  vm-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
      - name: Enable KVM and vhost-vsock
        run: |
          sudo modprobe vhost_vsock || echo "vhost_vsock unavailable, vsock leg will be skipped"
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm || true
          [ -e /dev/vhost-vsock ] && sudo chmod 666 /dev/vhost-vsock || true
      - name: Run VM end-to-end test
        run: tests/vm-e2e.sh
